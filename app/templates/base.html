<html lang="ru">
<style>
#toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999;
}

.toast {
    min-width: 240px;
    margin-bottom: 10px;
    padding: 12px 16px;
    border-radius: 6px;
    color: #fff;
    font-size: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    opacity: 0;
    transform: translateY(-10px);
    transition: opacity .2s ease, transform .2s ease;
}

.toast-show {
    opacity: 1;
    transform: translateY(0);
}

.toast-success {
    background: #2ecc71;
}

.toast-error {
    background: #e74c3c;
}
</style>

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>{% block title %}PriceWatch{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
<div id="toast-container"></div>
<script>
  function showToast(message, status) {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = 'toast ' + (status === 'ok' ? 'toast-success' : 'toast-error');
      toast.textContent = message;

      container.appendChild(toast);

      // запуск анимации
      requestAnimationFrame(() => {
          toast.classList.add('toast-show');
      });

      // убрать через 3 секунды
      setTimeout(() => {
          toast.classList.remove('toast-show');
          setTimeout(() => toast.remove(), 200);
      }, 3000);
  }
</script>

<header class="container">
    <a class="logo" href="/">PriceWatch</a>
</header>
<main class="container">
    {% block content %}{% endblock %}
</main>
<footer class="container small muted">Каркас</footer>
</body>
</html>
